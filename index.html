<!DOCTYPE html>
<html lang="fr" data-theme="calque" data-font="plex">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PocketGraph">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="PocketGraph: graphing calculator for functions, sequences and series, linear algebra and differential equations.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='9' fill='%233B6CF6'/%3E%3Cpath d='M9 21c3.5 0 4.5-11 8-11s3.5 7 7 7' stroke='%23fff' stroke-width='2.8' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<title>PocketGraph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-math:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --accent:#3B6CF6;
  --pw:384px;
  --sh:160px;
  --kb:0px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
[data-font=geist]{--font-ui:'Geist',system-ui,-apple-system,sans-serif;--font-math:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace}
[data-font=system]{--font-ui:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--font-math:ui-monospace,'SF Mono',Menlo,Consolas,monospace}

/* themes */
[data-theme=calque]{--cv:#FFFFFF;--bg:#F5F6F8;--surface:rgba(255,255,255,.9);--solid:#FFFFFF;--field:#F0F2F5;--line:rgba(20,28,45,.08);--line-2:rgba(20,28,45,.15);--text:#141A26;--text-2:#5A6372;--text-3:#9AA2AF;--kp:#E9ECF0;--key:#FFFFFF;--key-2:#D9DEE5;--shadow:0 18px 40px -18px rgba(20,28,45,.35);--danger:#D93B3B;color-scheme:light}
[data-theme=millimetre]{--cv:#FFFEFA;--bg:#FBF8F2;--surface:rgba(255,254,250,.92);--solid:#FFFEFA;--field:#F6F1E8;--line:rgba(120,60,20,.10);--line-2:rgba(120,60,20,.18);--text:#22190F;--text-2:#6F5E4E;--text-3:#A8998A;--kp:#F1EBE1;--key:#FFFEFA;--key-2:#E4DACB;--shadow:0 18px 40px -18px rgba(90,50,20,.35);--danger:#C93A2B;color-scheme:light}
[data-theme=ardoise]{--cv:#1B1F27;--bg:#161A21;--surface:rgba(30,35,45,.88);--solid:#1F242D;--field:#2A303B;--line:rgba(220,228,240,.08);--line-2:rgba(220,228,240,.16);--text:#E9EDF4;--text-2:#A3ACBA;--text-3:#6D7686;--kp:#232933;--key:#323946;--key-2:#262C36;--shadow:0 18px 40px -18px rgba(0,0,0,.6);--danger:#FF6B6B;color-scheme:dark}
[data-theme=craie]{--cv:#1F2E28;--bg:#1A2722;--surface:rgba(30,45,39,.9);--solid:#22332C;--field:#2C4038;--line:rgba(236,242,232,.09);--line-2:rgba(236,242,232,.17);--text:#EEF3EA;--text-2:#AFC0B4;--text-3:#73887C;--kp:#263932;--key:#34493F;--key-2:#2A3C35;--shadow:0 18px 40px -18px rgba(0,0,0,.6);--danger:#FF8A7A;color-scheme:dark}
[data-theme=nuit]{--cv:#000000;--bg:#000000;--surface:rgba(16,16,19,.92);--solid:#0D0D10;--field:#1C1C21;--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.15);--text:#F2F2F5;--text-2:#9B9BA6;--text-3:#5F5F69;--kp:#0D0D10;--key:#222228;--key-2:#17171B;--shadow:0 18px 40px -18px rgba(0,0,0,.9);--danger:#FF6B6B;color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;background:var(--cv);color:var(--text);font:400 15px/1.4 var(--font-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text;font-family:inherit;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;top:0;bottom:0;left:0;right:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv.grabbing{cursor:grabbing}
.desk.open #cv{left:var(--pw);width:calc(100% - var(--pw))}

/* panel */
.panel{position:absolute;z-index:10;display:flex;flex-direction:column;background:var(--solid);color:var(--text)}
.desk .panel{left:0;top:0;bottom:0;width:var(--pw);border-right:1px solid var(--line-2);padding-top:var(--sat)}
.desk:not(.open) .panel{transform:translateX(-100%)}
.desk .panel{transition:transform .32s var(--ease)}
.desk.kpon .panel{bottom:var(--kph,0px)}
.mob .panel{left:0;right:0;bottom:var(--kb);height:var(--sh);border-radius:20px 20px 0 0;background:var(--surface);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);box-shadow:0 -1px 0 var(--line-2),var(--shadow)}
.mob .panel.anim{transition:height .34s var(--ease),bottom .25s var(--ease)}
.grip{display:none}
.mob .grip{display:flex;justify-content:center;align-items:center;height:22px;flex:none;touch-action:none;cursor:ns-resize}
.mob .grip span{width:38px;height:5px;border-radius:3px;background:var(--line-2)}
.ph{display:flex;align-items:center;gap:2px;padding:6px 8px 6px 14px;flex:none;border-bottom:1px solid var(--line)}
.desk .ph{padding:12px 10px 12px 16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15.5px;letter-spacing:-.01em;margin-right:auto;white-space:nowrap}
.brand svg{width:22px;height:22px}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:11px;color:var(--text-2);transition:background .15s,color .15s}
.ib:hover{background:var(--field);color:var(--text)}
.ib:active{background:var(--line-2)}
.ib[disabled]{opacity:.35;pointer-events:none}
.ib.prim{background:var(--accent);color:#fff}
.ib.prim:hover{filter:brightness(1.08);background:var(--accent);color:#fff}
.list{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(24px + var(--sab))}
.desk .list{padding-bottom:40px}

/* rows */
.row{display:grid;grid-template-columns:46px minmax(0,1fr) 38px;border-bottom:1px solid var(--line);position:relative;background:transparent}
.row.sel{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.row.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.gut{display:flex;justify-content:center;padding-top:16px}
.sw{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--c);background:var(--c);transition:background .15s,transform .15s;flex:none}
.sw:active{transform:scale(.9)}
.row.hid .sw{background:transparent}
.sw.nodot{border-style:dashed;background:transparent;border-color:var(--text-3)}
.mo{display:flex;justify-content:center;padding-top:10px}
.mo .ib{width:34px;height:36px;color:var(--text-3)}
.bd{min-width:0;padding:4px 0 6px}
.math{display:block;width:100%;border:0;outline:none;background:transparent;font:450 17px/1.35 var(--font-math);letter-spacing:-.01em;padding:12px 0 10px;color:var(--text);caret-color:var(--accent);-webkit-appearance:none;appearance:none;border-radius:0}
.math::placeholder{color:var(--text-3);font-family:var(--font-ui);font-weight:400;letter-spacing:0}
.math.bad{text-decoration:underline wavy var(--danger);text-decoration-thickness:1.2px;text-underline-offset:4px}
.kind{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);padding-top:12px;font-weight:500}
.kind svg{width:15px;height:15px}
.fl{display:flex;align-items:center;gap:8px;min-width:0}
.fl .lb{font:450 16px var(--font-math);color:var(--text-2);white-space:nowrap;flex:none}
.fl .math{flex:1;min-width:0}
.mini{width:64px;flex:none;border:0;outline:none;background:var(--field);border-radius:8px;padding:7px 8px;font:450 16px var(--font-math);color:var(--text);text-align:center;-webkit-appearance:none;appearance:none}
.mini:focus{box-shadow:0 0 0 2px var(--accent)}
.mini.bad{box-shadow:0 0 0 1.5px var(--danger)}
.mini.w{width:84px}
.mini.name{width:46px}
.st{font-size:13.5px;color:var(--text-2);padding:0 4px 8px 0;line-height:1.45}
.st:empty{display:none}
.st .val{font:500 16px var(--font-math);color:var(--text);word-break:break-word}
.st .err{color:var(--danger)}
.st .hint{color:var(--text-2)}
.tools{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line-2);font-size:13.5px;color:var(--text-2);white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.chip svg{width:16px;height:16px}
.chip.on{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--text)}
.chip:hover{border-color:var(--text-3)}
.chip.sug{border-style:dashed;color:var(--text)}
.seg{display:inline-flex;background:var(--field);border-radius:10px;padding:3px;gap:2px}
.seg button{height:28px;padding:0 11px;border-radius:8px;font-size:13.5px;color:var(--text-2);white-space:nowrap}
.seg button.on{background:var(--solid);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ln{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:3px 0}
.ln .t{font-size:13.5px;color:var(--text-2)}
.sl{display:flex;align-items:center;gap:8px;padding:2px 0 10px}
.sl .mini{width:58px;font-size:15px;padding:6px 4px}
input[type=range]{flex:1;min-width:60px;-webkit-appearance:none;appearance:none;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line-2)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--c,var(--accent));margin-top:-9px;border:3px solid var(--solid);box-shadow:0 1px 4px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--c,var(--accent));border:3px solid var(--solid)}
.play{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--field);color:var(--text);flex:none}
.play svg{width:16px;height:16px}
.play.on{background:var(--accent);color:#fff}
.mx{display:inline-grid;gap:4px 6px;padding:6px 10px;position:relative;margin:4px 0}
.mx::before,.mx::after{content:"";position:absolute;top:0;bottom:0;width:7px;border:1.6px solid var(--text-2)}
.mx::before{left:0;border-right:0;border-radius:3px 0 0 3px}
.mx::after{right:0;border-left:0;border-radius:0 3px 3px 0}
.mx input{width:58px;text-align:center;border:0;outline:none;background:var(--field);border-radius:7px;padding:7px 2px;font:450 16px var(--font-math);color:var(--text)}
.mx input:focus{box-shadow:0 0 0 2px var(--accent)}
.mx input.bad{box-shadow:0 0 0 1.5px var(--danger)}
.mx span{font:450 15px var(--font-math);text-align:center;padding:1px 6px;min-width:28px;color:var(--text)}
.props{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:4px 0 12px;font-size:13.5px;align-items:baseline}
.props dt{color:var(--text-2);white-space:nowrap}
.props dd{margin:0;font:450 15px var(--font-math);color:var(--text);min-width:0;word-break:break-word}
.step{display:inline-flex;align-items:center;background:var(--field);border-radius:9px}
.step button{width:30px;height:32px;display:grid;place-items:center;color:var(--text-2)}
.step b{font:500 15px var(--font-math);min-width:16px;text-align:center}
.tbl{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin:2px 0 12px;-webkit-overflow-scrolling:touch}
.tbl table{border-collapse:collapse;width:100%;font:450 13.5px var(--font-math)}
.tbl th{position:sticky;top:0;background:var(--solid);color:var(--text-2);font-weight:500;text-align:right;padding:6px 10px;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:4px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.ics{display:flex;flex-direction:column;gap:6px;padding:2px 0 6px}
.ic{display:flex;align-items:center;gap:6px}
.ic .t{font:450 15px var(--font-math);color:var(--text-2)}
.ic .mini{width:62px}
.ic .ib{width:32px;height:32px}
textarea.note{display:block;width:100%;border:0;outline:none;resize:none;background:transparent;font:400 15.5px/1.5 var(--font-ui);padding:12px 0 10px;color:var(--text);min-height:46px}
.empty{padding:22px 18px 10px;color:var(--text-2);font-size:14px;line-height:1.5}
.empty p{margin:0 0 12px}
.empty .tools{padding:0}
.add-row{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;color:var(--text-3);font-size:14px}
.add-row:hover{color:var(--text-2)}

/* floating controls */
.fab{position:absolute;z-index:5;right:14px;display:flex;flex-direction:column;gap:6px;transition:bottom .3s var(--ease)}
.desk .fab{bottom:20px}
.mob .fab{bottom:calc(var(--sh) + var(--kb) + 12px)}
.fab button{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface);color:var(--text);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 0 0 1px var(--line-2),0 6px 18px -8px rgba(0,0,0,.35)}
.fab button:active{transform:scale(.94)}
.fab .dim{font:600 14px var(--font-ui);letter-spacing:.02em;color:var(--accent)}
.kind span{white-space:nowrap}
.showp{position:absolute;z-index:5;left:14px;top:calc(14px + var(--sat));display:none}
.desk:not(.open) .showp{display:flex}
.showp button{height:42px;padding:0 14px 0 10px;gap:8px;display:flex;align-items:center;border-radius:13px;background:var(--surface);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 0 0 1px var(--line-2),0 6px 18px -8px rgba(0,0,0,.35);font-weight:600}
.showp svg.logo{width:20px;height:20px}

/* popovers & modal */
.pop{position:fixed;z-index:40;min-width:230px;max-width:min(320px,calc(100vw - 20px));max-height:min(70vh,560px);overflow:auto;background:var(--solid);border-radius:14px;box-shadow:0 0 0 1px var(--line-2),0 22px 50px -16px rgba(0,0,0,.45);padding:6px;transform-origin:top right;animation:pop .16s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:10px 10px;border-radius:9px;text-align:left;font-size:14.5px}
.mi:hover{background:var(--field)}
.mi svg{color:var(--text-2)}
.mi small{display:block;font-size:12.5px;color:var(--text-2);margin-top:1px}
.mi.dng{color:var(--danger)}
.mi.dng svg{color:var(--danger)}
.sep{height:1px;background:var(--line);margin:5px 6px}
.ptitle{font-size:12.5px;color:var(--text-2);padding:8px 10px 4px;font-weight:500}
.sws{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:6px 10px 10px}
.sws button{width:34px;height:34px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.0)}
.sws button.on{box-shadow:0 0 0 2px var(--solid),0 0 0 4px var(--c)}
.sws label{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--text-3);position:relative;overflow:hidden;color:var(--text-2)}
.sws label input{position:absolute;inset:0;opacity:0;cursor:pointer}
.veil{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.38);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-height:calc(100% - var(--sat) - 30px);background:var(--solid);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .3s var(--ease);padding-bottom:var(--sab)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (min-width:700px){.veil{align-items:center}.modal{width:480px;border-radius:20px;max-height:86vh;padding-bottom:0}}
.mh{display:flex;align-items:center;padding:14px 10px 10px 20px;border-bottom:1px solid var(--line)}
.mh h2{font-size:17px;font-weight:600;margin:0 auto 0 0;letter-spacing:-.01em}
.mb{overflow:auto;padding:6px 20px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.mb h3{font-size:13.5px;color:var(--text-2);font-weight:500;margin:20px 0 10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;min-height:46px;border-bottom:1px solid var(--line)}
.opt>span{font-size:15px}
.opt:last-child{border-bottom:0}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{border-radius:12px;padding:8px;border:1.5px solid var(--line-2);text-align:left;font-size:13px}
.th.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.th i{display:block;height:46px;border-radius:7px;margin-bottom:7px;background-size:10px 10px;position:relative;overflow:hidden}
.tog{width:46px;height:28px;border-radius:14px;background:var(--line-2);position:relative;transition:background .2s;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.tog.on{background:var(--accent)}
.tog.on::after{transform:translateX(18px)}
.ver{font-size:12.5px;color:var(--text-3);text-align:center;padding:22px 0 4px}
.help{font-size:14px;line-height:1.5}
.help table{width:100%;border-collapse:collapse}
.help td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.help td:first-child{font:450 14px var(--font-math);padding-right:14px;white-space:nowrap;color:var(--text)}
.help td:last-child{color:var(--text-2)}
.toast{position:fixed;z-index:60;left:50%;top:calc(14px + var(--sat));transform:translateX(-50%);background:var(--text);color:var(--solid);padding:10px 16px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);animation:tin .25s var(--ease);max-width:calc(100vw - 30px)}
.toast span{white-space:nowrap}.toast button{white-space:nowrap;color:var(--solid);font-weight:600;text-decoration:underline;text-underline-offset:3px}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}

/* keypad */
.kp{position:fixed;z-index:30;left:0;right:0;bottom:0;background:var(--kp);padding:8px 6px calc(8px + var(--sab));display:none;border-top:1px solid var(--line);touch-action:none}
.kpon .kp{display:block}
.desk .kp{right:auto;width:var(--pw);border-right:1px solid var(--line-2)}
.kr{display:flex;gap:6px;margin-bottom:6px}
.kr:last-child{margin-bottom:0}
.kg{width:10px;flex:none}
.k{flex:1;height:44px;border-radius:9px;background:var(--key);color:var(--text);display:grid;place-items:center;font:450 18px var(--font-math);box-shadow:0 1px 0 rgba(0,0,0,.18);min-width:0;padding:0;white-space:nowrap}
.k.s{background:var(--key-2);font-size:15px}
.k.f{font-size:15px}
.k.w2{flex:2.1}
.k.acc{background:var(--accent);color:#fff}
.k.dn{transform:translateY(1px);filter:brightness(.88)}
.k svg{width:20px;height:20px}
.k sup{font-size:.65em;margin-left:1px}

function defaultsFor(type) {

    case 'seq': return { name: 'u', mode: 'rec', formula: '', init: '1', n0: '0', N: '30', pts: true, ser: false, cob: false, tab: false };

function nextColor() {
  const cnt = new Array(8).fill(0); S.items.forEach(i => { if (typeof i.color === 'number') cnt[i.color % 8]++; });
  const m = Math.min(...cnt); const start = S.items.length % 8;

/* ---------- persistence ---------- */
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY); if (!raw) return false;
    const d = JSON.parse(raw); if (!d || !Array.isArray(d.items)) return false;
    S.items = d.items.map(sanitizeItem).filter(Boolean);
    if (d.view && [d.view.cx, d.view.cy, d.view.sx, d.view.sy].every(Number.isFinite)) S.view = d.view;
    S.settings = { ...DEF_SETTINGS, ...(d.settings || {}) };
    if (d.view3 && [d.view3.yaw, d.view3.pitch, d.view3.R].every(Number.isFinite) && Array.isArray(d.view3.c)) S.view3 = d.view3;
    S.dim = d.dim === '3d' ? '3d' : '2d';
    return true;
  } catch { return false; }
}
let saveTimer = 0;
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify({ v: 1, items: S.items, view: S.view, view3: S.view3, dim: S.dim, settings: S.settings })); } catch { } }
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); }

/* ---------- undo / redo ---------- */
const HIST = { stack: [], idx: -1, timer: 0 };
const snapshot = () => JSON.stringify(S.items);
function histInit() { HIST.stack = [snapshot()]; HIST.idx = 0; updateUndoUI(); }
function histCommit() {
  clearTimeout(HIST.timer); const s = snapshot(); if (s === HIST.stack[HIST.idx]) return;
  HIST.stack = HIST.stack.slice(0, HIST.idx + 1); HIST.stack.push(s);
  if (HIST.stack.length > 150) HIST.stack.shift(); HIST.idx = HIST.stack.length - 1; updateUndoUI();
}
function histSoon() { clearTimeout(HIST.timer); HIST.timer = setTimeout(histCommit, 650); }
function undo() { histCommit(); if (HIST.idx <= 0) return; HIST.idx--; histRestore(); }
function redo() { if (HIST.idx >= HIST.stack.length - 1) return; HIST.idx++; histRestore(); }
function histRestore() { S.items = JSON.parse(HIST.stack[HIST.idx]); stopAllPlay(); renderList(); recompute(); saveSoon(); updateUndoUI(); }
function updateUndoUI() { const u = $('#bUndo'), r = $('#bRedo'); if (u) u.disabled = HIST.idx <= 0 && snapshot() === HIST.stack[HIST.idx]; if (r) r.disabled = HIST.idx >= HIST.stack.length - 1; }

/* ---------- compilation of all items ---------- */
const RES = new Map();
const RESERVED = new Set(['x', 'y', 'z', 'e', 'pi', 'tau', 'inf', 'infinity']);
const IDP = '[A-Za-z\\u03b1-\\u03c9](?:_[A-Za-z0-9]+)?';
const FNDEF_RE = new RegExp('^\\s*(' + IDP + ')\\s*\\(\\s*(' + IDP + '\\s*(?:,\\s*' + IDP + '\\s*)*)\\)\\s*=(?![=<>])');
const PE = (c, a) => new PGM.PGErr(c, a);
const validName = n => !!n && !RESERVED.has(n) && !PGM.isFuncName(n) && !(n in PGM.CONSTS) && !n.includes("'");
function normName(s) { try { const tk = PGM.tokenize(String(s).trim()); if (tk.length === 1 && tk[0].k === 'id' && !tk[0].primes) return tk[0].v; } catch { } return null; }
const numLit = n => n.t === 'num' ? n.v : (n.t === 'neg' && n.a.t === 'num' ? -n.a.v : null);
function formulaAst(src, funcs) {
  const a = PGM.parse(String(src || ''), funcs); if (!a) return null;
  if (a.op === '=') return a.rhs; if (a.op) throw PE('syntax'); return a.lhs;
}
function exprAst(src, funcs) { const a = PGM.parse(String(src || ''), funcs); if (!a) return null; if (a.op) throw PE('syntax'); return a.lhs; }
const addFree = (r, node, bound) => { if (!node) return; const f = PGM.freeVars(node); f.vars.forEach(v => { if (!bound || !bound.includes(v)) r.vars.add(v); }); f.calls.forEach(c => r.calls.add(c)); };
const asNum = v => typeof v === 'number' ? v : NaN;
const evalNode = (node, dflt) => node ? asNum(PGM.compile(node, [])()) : dflt;

const PREP = {
  expr(it, r, funcs) {
    const txt = it.text.trim(); if (!txt) { r.kind = 'empty'; return; }
    const ast = PGM.parse(txt, funcs); if (!ast) { r.kind = 'empty'; return; }
    const { lhs, op, rhs } = ast;
    const FV = n => PGM.freeVars(n).vars;
    const isV = (n, nm) => n.t === 'var' && n.name === nm;
    const set = (kind, node, ctx, extra) => { r.kind = kind; r.node = node; r.ctx = ctx; r.vars = new Set(); r.calls = new Set(); addFree(r, node); Object.assign(r, extra || {}); };
    if (!op) return set('bare', lhs, []);
    if (op === '=') {
      if (lhs.t === 'call' && funcs.has(lhs.name) && !lhs.primes && lhs.args.every(a => a.t === 'var' && !a.name.includes("'"))) {
        const params = lhs.args.map(a => a.name);
        if (new Set(params).size !== params.length) throw PE('syntax');
        set('func', rhs, params, { funcName: lhs.name, params }); params.forEach(p => r.vars.delete(p)); return;
      }
      if (isV(lhs, "y'") || isV(lhs, "y''")) throw PE('useOde');
      if (isV(lhs, 'z') && !FV(rhs).has('z')) return set('fz', rhs, ['x', 'y']);
      if (isV(rhs, 'z') && !FV(lhs).has('z')) return set('fz', lhs, ['x', 'y']);
      if (isV(lhs, 'y') && !FV(rhs).has('y')) return set('fx', rhs, ['x']);
      if (isV(rhs, 'y') && !FV(lhs).has('y')) return set('fx', lhs, ['x']);
      if (isV(lhs, 'x') && !FV(rhs).has('x') && !FV(rhs).has('z')) return set('fy', rhs, ['y']);
      if (isV(rhs, 'x') && !FV(lhs).has('x') && !FV(lhs).has('z')) return set('fy', lhs, ['y']);
      if (isV(lhs, 'r') && !['r', 'x', 'y'].some(v => FV(rhs).has(v))) return set('polar', rhs, ['theta']);
      if (lhs.t === 'var' && !lhs.name.includes("'")) {
        const f = FV(rhs);
        if (!f.has('x') && !f.has('y')) {
          if (!validName(lhs.name)) throw PE('reserved', lhs.name);
          const lit = numLit(rhs);
          if (lit !== null) return set('slider', rhs, [], { defName: lhs.name, value: lit });
          return set('const', rhs, [], { defName: lhs.name });
        }
      }
      return set('imp', { t: 'bin', op: '-', a: lhs, b: rhs }, ['x', 'y']);
    }
    const flip = { '<': '>', '>': '<', '<=': '>=', '>=': '<=' };
    if (isV(lhs, 'y') && !FV(rhs).has('y')) return set('ineqY', rhs, ['x'], { op });
    if (isV(rhs, 'y') && !FV(lhs).has('y')) return set('ineqY', lhs, ['x'], { op: flip[op] });
    if (isV(lhs, 'x') && !FV(rhs).has('x')) return set('ineqX', rhs, ['y'], { op });
    if (isV(rhs, 'x') && !FV(lhs).has('x')) return set('ineqX', lhs, ['y'], { op: flip[op] });
    return set('ineq', { t: 'bin', op: '-', a: lhs, b: rhs }, ['x', 'y'], { op });
  },
  seq(it, r, funcs) {
    const nm = normName(it.name); if (!nm || !validName(nm)) throw PE('name');
    r.funcName = nm; r.vars = new Set(); r.calls = new Set(); r.ctx = [];
    r.fNode = formulaAst(it.formula, funcs);
    if (!r.fNode) { r.kind = 'empty'; return; }
    r.kind = 'seq';
    addFree(r, r.fNode, ['n', nm + '_n']);
    if (it.mode === 'rec') {
      const ia = PGM.parse('(' + (it.init.trim() || '0') + ')', funcs);
      if (!ia || ia.op) throw PE('syntax');
      r.initNodes = ia.lhs.t === 'tuple' ? ia.lhs.items : [ia.lhs];
      r.initNodes.forEach(n => addFree(r, n));
    }
    r.n0Node = exprAst(it.n0 || '0', funcs) || { t: 'num', v: 0 };
    r.NNode = exprAst(it.N || '30', funcs) || { t: 'num', v: 30 };
    addFree(r, r.n0Node); addFree(r, r.NNode);
  },
  mat(it, r, funcs) {
    const nm = normName(it.name); if (!nm || !validName(nm)) throw PE('name');
    r.kind = 'mat'; r.defName = nm; r.vars = new Set(); r.calls = new Set(); r.ctx = []; r.cellNodes = []; r.cellErr = [];
    it.cells.forEach((row, i) => {
      r.cellNodes.push([]); r.cellErr.push([]);
      row.forEach((c, j) => {
        let node = null;
        try { node = exprAst(String(c).trim() || '0', funcs); addFree(r, node); } catch { r.cellErr[i][j] = true; r.badCells = true; }
        r.cellNodes[i].push(node);
      });
    });
  },
  ode(it, r, funcs) {
    r.vars = new Set(); r.calls = new Set();
    r.ctx = it.order === 2 ? ['x', 'y', "y'"] : ['x', 'y'];
    r.fNode = formulaAst(it.f, funcs); if (!r.fNode) { r.kind = 'empty'; return; }
    r.kind = 'ode'; addFree(r, r.fNode, r.ctx);
    prepIcs(it, r, funcs, it.order === 2 ? ['x', 'y', 'yp'] : ['x', 'y']);
    if (it.h.trim()) { r.hNode = exprAst(it.h, funcs); addFree(r, r.hNode); }
  },
  sys(it, r, funcs) {
    r.dim3 = !!it.fz.trim();
    r.vars = new Set(); r.calls = new Set(); r.ctx = r.dim3 ? ['x', 'y', 'z', 't'] : ['x', 'y', 't'];
    r.fxNode = formulaAst(it.fx, funcs); r.fyNode = formulaAst(it.fy, funcs); r.fzNode = r.dim3 ? formulaAst(it.fz, funcs) : null;
    if (!r.fxNode || !r.fyNode) { r.kind = 'empty'; return; }
    r.kind = 'sys'; addFree(r, r.fxNode, r.ctx); addFree(r, r.fyNode, r.ctx); if (r.fzNode) addFree(r, r.fzNode, r.ctx);
    prepIcs(it, r, funcs, r.dim3 ? ['x', 'y', 'z'] : ['x', 'y']);
    r.TNode = exprAst(it.T || '30', funcs) || { t: 'num', v: 30 }; addFree(r, r.TNode);
  },
  note(it, r) { r.kind = 'note'; },
};
function prepIcs(it, r, funcs, keys) {
  r.icNodes = []; r.icBad = new Set();
  it.ics.forEach((ic, k) => {
    const o = {};
    for (const key of keys) { try { o[key] = exprAst(ic[key] || '0', funcs); addFree(r, o[key]); } catch { r.icBad.add(k + '.' + key); o.bad = true; } }
    r.icNodes.push(o);
  });
}

function makeSeq(r) {
  const it = r.it, nm = r.funcName, rec = it.mode === 'rec', key = JSON.stringify(nm);
  const fn = PGM.compile(r.fNode, ['n'], { [nm + '_n']: rec ? 'F[' + key + '](a0)' : 'NaN' });
  const initF = rec ? r.initNodes.map(n => PGM.compile(n, [])) : [];
  const n0F = PGM.compile(r.n0Node, []), NF = PGM.compile(r.NNode, []);
  let arr = null, n0 = 0, building = false;
  function build() {
    arr = []; building = true;
    try {
      n0 = Math.round(asNum(n0F())); let N = Math.round(asNum(NF()));
      if (!isFinite(n0) || !isFinite(N) || N < n0) throw PE('range');
      N = Math.min(N, n0 + 5000);
      if (rec) { for (const f of initF) arr.push(asNum(f())); for (let n = n0 + arr.length - 1; n < N; n++) arr.push(asNum(fn(n))); arr.length = Math.min(arr.length, N - n0 + 1); }
      else for (let k = n0; k <= N; k++) arr.push(asNum(fn(k)));
    } catch (e) { r.buildErr = e; throw e; }
    finally { building = false; r.n0 = n0; }
  }
  r.getAll = () => { if (arr === null) build(); if (r.buildErr) throw r.buildErr; return arr; };
  if (rec) { try { r.cobF = PGM.compile(r.fNode, ['n', '\u0000c'], { __self: nm, __selfCode: 'a1', [nm + '_n']: 'a1' }); } catch { r.cobF = null; } }
  return (k) => {
    if (arr === null) build();
    k = Math.round(asNum(k)); const i = k - n0;
    if (i >= 0 && i < arr.length) return arr[i];
    if (!rec && !building && isFinite(k)) return asNum(fn(k));
    return NaN;
  };
}

function compileAll() {
  PGM.clearEnv(); RES.clear();
  const V = PGM.V, F = PGM.F;
  const funcNames = new Set();
  for (const it of S.items) {
    if (it.type === 'expr') { const m = it.text.match(FNDEF_RE); if (m) { const n = normName(m[1]); if (n && validName(n)) funcNames.add(n); } }
    else if (it.type === 'seq') { const n = normName(it.name); if (n && validName(n)) funcNames.add(n); }
  }
  const entries = [];
  for (const it of S.items) {
    const r = { kind: 'none', it, vars: new Set(), calls: new Set(), ctx: [] };
    RES.set(it.id, r); entries.push(r);
    try { if (PREP[it.type]) PREP[it.type](it, r, funcNames); } catch (e) { r.kind = 'error'; r.err = e; }
  }
  const owner = new Map();
  for (const r of entries) {
    const nm = r.defName || r.funcName; if (!nm || r.kind === 'error') continue;
    if (owner.has(nm)) { r.kind = 'error'; r.err = PE('dup', nm); continue; }
    owner.set(nm, r);
  }
  const failed = new Set();
  for (const n of funcNames) { const o = owner.get(n); if (!o || o.kind === 'error' || o.kind === 'empty') failed.add(n); }
  const finfo = new Map();
  for (const r of entries) if ((r.kind === 'func' || r.kind === 'seq') && owner.get(r.funcName) === r) finfo.set(r.funcName, r);
  const trans = (r) => {
    const out = new Set(r.vars), seen = new Set(), st = [...r.calls];
    while (st.length) {
      const c = st.pop(); if (seen.has(c)) continue; seen.add(c);
      const fi = finfo.get(c); if (!fi) { out.add(c); continue; }
      fi.vars.forEach(v => out.add(v)); fi.calls.forEach(x => st.push(x));
    }
    return out;
  };
  // user functions & sequences
  for (const r of finfo.values()) {
    try { F[r.funcName] = r.kind === 'func' ? PGM.compile(r.node, r.params) : makeSeq(r); }
    catch (e) { r.kind = 'error'; r.err = e; failed.add(r.funcName); }
  }
  // definitions (sliders, constants, matrices) in dependency order
  const defs = entries.filter(r => r.defName && owner.get(r.defName) === r && r.kind !== 'error');
  const defined = new Set(defs.map(r => r.defName));
  const done = new Set();
  for (const r of defs) r.deps = trans(r);
  let pending = defs.slice(), progress = true;
  const evalDef = r => {
    if (r.kind === 'slider') { V[r.defName] = r.value; return; }
    if (r.kind === 'mat') {
      if (r.badCells) throw PE('cells');
      const d = r.cellNodes.map((row, i) => row.map((n, j) => { let v; try { v = PGM.compile(n, [])(); } catch { v = NaN; } if (typeof v !== 'number') { r.cellErr[i][j] = true; r.badCells = true; } return v; }));
      if (r.badCells) throw PE('cells');
      r.value = new PGM.Mat(d); V[r.defName] = r.value;
      if (r.value.r === 2 && r.value.c === 2) { try { r.eig = PGM.eigen(r.value).vals.filter(v => !v.im && !v.dup); } catch { r.eig = null; } }
      return;
    }
    r.fn = PGM.compile(r.node, []); r.value = r.fn(); V[r.defName] = r.value;
  };
  while (pending.length && progress) {
    progress = false;
    for (const r of pending.slice()) {
      const deps = [...r.deps];
      const bad = deps.find(v => failed.has(v));
      const miss = deps.filter(v => !defined.has(v) && !failed.has(v));
      let finished = false;
      if (bad) { r.kind = 'error'; r.err = PE('dep', bad); finished = true; }
      else if (miss.length) { r.missing = miss; r.wasKind = r.kind; r.kind = 'missing'; finished = true; }
      else if (deps.every(v => done.has(v))) {
        try { evalDef(r); done.add(r.defName); } catch (e) { r.kind = 'error'; r.err = e; }
        finished = true;
      }
      if (finished) { if (!done.has(r.defName)) failed.add(r.defName); pending.splice(pending.indexOf(r), 1); progress = true; }
    }
  }
  for (const r of pending) { r.kind = 'error'; r.err = PE('cycle'); failed.add(r.defName); }
  for (const r of defs) if (r.kind === 'const' || r.kind === 'slider') classifyValue(r);

  // everything else
  for (const r of entries) {
    if (r.defName || ['error', 'empty', 'none', 'note'].includes(r.kind)) continue;
    try { resolveItem(r, trans, failed, done, defined); } catch (e) { r.kind = 'error'; r.err = e; }
  }
}
function classifyValue(r) {
  const v = r.value;
  if (v instanceof PGM.Pt) { r.draw = 'pt'; setDrag(r); }
  else if (v instanceof PGM.P3) r.draw = 'pt3';
  else if (PGM.isM(v) && ((v.c === 1 && v.r === 3) || (v.r === 1 && v.c === 3))) r.draw = 'vec3';
  else if (PGM.isM(v) && v.c === 1 && v.r === 2) r.draw = 'vec';
  else if (PGM.isM(v) && v.r === 1 && v.c === 2) r.draw = 'vec';
}
function setDrag(r) {
  const n = r.node; if (!n || n.t !== 'tuple') return;
  const sl = nm => { for (const q of RES.values()) if (q.kind === 'slider' && q.defName === nm) return q.it.id; return null; };
  const a = n.items[0].t === 'var' ? sl(n.items[0].name) : null, b = n.items[1].t === 'var' ? sl(n.items[1].name) : null;
  if (a || b) r.drag = [a, b];
}
function resolveItem(r, trans, failed, done, defined) {
  let deps = trans(r);
  if (r.kind === 'bare') {
    if (r.node.t === 'tuple' && deps.has('t') && !defined.has('t')) { r.kind = r.node.items.length === 3 ? 'param3' : 'param'; r.ctx = ['t']; }
    else if (deps.has('x') && !deps.has('y') && !deps.has('z')) { r.kind = 'fx'; r.ctx = ['x']; }
    else if (deps.has('y') && !deps.has('z')) { r.kind = 'fz'; r.ctx = ['x', 'y']; }
    else r.kind = 'value';
  }
  if (r.kind === 'imp' && deps.has('z')) { r.kind = 'imp3'; r.ctx = ['x', 'y', 'z']; }
  if (r.kind.startsWith('ineq') && deps.has('z')) throw PE('ineq3');
  r.ctx.forEach(c => deps.delete(c));
  if (r.kind === 'func') r.params.forEach(p => deps.delete(p));
  if (r.kind === 'seq') deps.delete(r.funcName);
  const bad = [...deps].find(v => failed.has(v));
